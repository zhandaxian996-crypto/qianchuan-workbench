name: Render Remotion Promo

on:
  push:
    branches:
      - promo-remotion-cloud-render
    paths:
      - 'promo/remotion/**'
      - '.github/workflows/render-remotion-promo.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: promo/remotion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: promo/remotion/package.json

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'

      - name: Restore real workbench screenshot
        run: |
          cat public/wb-part-*.txt | tr -d '\r\n' | base64 --decode > public/workbench-day.webp
          file public/workbench-day.webp
          ls -lh public/workbench-day.webp
          test "$(stat -c%s public/workbench-day.webp)" -gt 20000

      - name: Apply V2 visual fixes
        run: node fix-v2.cjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render verification stills
        run: |
          mkdir -p out/checks
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-02s.png --frame=60
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-07s.png --frame=210
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-15s.png --frame=450
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-22s.png --frame=660
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-35s.png --frame=1050
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-37s.png --frame=1110
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-43s.png --frame=1290
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-51s.png --frame=1530
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-57s.png --frame=1710

      - name: Render 1080p MP4
        run: |
          mkdir -p out
          npm run render

      - name: Upload verification stills
        uses: actions/upload-artifact@v4
        with:
          name: qianchuan-remotion-v2-checks
          path: promo/remotion/out/checks/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: qianchuan-remotion-v2-1080p
          path: promo/remotion/out/qianchuan-open-source-1080p.mp4
          if-no-files-found: error
          retention-days: 7
