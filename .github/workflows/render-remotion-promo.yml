name: Render Remotion Promo

on:
  push:
    branches:
      - promo-remotion-cloud-render
    paths:
      - 'promo/remotion/**'
      - '.github/workflows/render-remotion-promo.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: promo/remotion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: promo/remotion/package.json

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'

      - name: Restore real workbench screenshot
        run: |
          cat public/wb-part-*.txt | tr -d '\r\n' | base64 --decode > public/workbench-day.webp
          file public/workbench-day.webp
          ls -lh public/workbench-day.webp
          test "$(stat -c%s public/workbench-day.webp)" -gt 20000

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render V3 verification stills
        run: |
          mkdir -p out/checks
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-02s.png --frame=60
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-06s.png --frame=180
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-12s.png --frame=360
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-19s.png --frame=570
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-27s.png --frame=810
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-33s.png --frame=990
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-37s.png --frame=1110
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-44s.png --frame=1320
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-53s.png --frame=1590
          npx remotion still src/index.ts QianchuanOpenSource out/checks/frame-58s.png --frame=1740

      - name: Render 1080p MP4
        run: |
          mkdir -p out
          npm run render

      - name: Upload V3 verification stills
        uses: actions/upload-artifact@v4
        with:
          name: qianchuan-remotion-v3-checks
          path: promo/remotion/out/checks/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload V3 video artifact
        uses: actions/upload-artifact@v4
        with:
          name: qianchuan-remotion-v3-1080p
          path: promo/remotion/out/qianchuan-open-source-1080p.mp4
          if-no-files-found: error
          retention-days: 7
